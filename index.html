<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Media Ajar Sistem Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f3f1;--pn:#fff;--ink:#13211d;--mu:#5a6e67;--ln:#d0dad5;--sb:#0e1d19;--bin:#0b7a64;--dec:#2159d6;--oct:#a8650c;--hex:#7a35e0;--ok:#157f3b;--no:#b3261e;--on:#fff;--m:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1411;--pn:#13211d;--ink:#e5f0eb;--mu:#93aaa2;--ln:#263b34;--sb:#070d0b;--bin:#2fd1ae;--dec:#6c9bff;--oct:#f0a641;--hex:#b58cff;--ok:#4ade80;--no:#ff8a80;--on:#08130f}}
:root[data-theme=dark]{--bg:#0b1411;--pn:#13211d;--ink:#e5f0eb;--mu:#93aaa2;--ln:#263b34;--sb:#070d0b;--bin:#2fd1ae;--dec:#6c9bff;--oct:#f0a641;--hex:#b58cff;--ok:#4ade80;--no:#ff8a80;--on:#08130f}
*{box-sizing:border-box}
body{margin:0;display:grid;grid-template-columns:290px 1fr;min-height:100vh;background:var(--bg);color:var(--ink);font:15.5px/1.6 "Space Grotesk",system-ui,sans-serif}
.sb{position:sticky;top:0;height:100vh;overflow:auto;background:var(--sb);color:#cfe0d9;padding:22px 14px;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:12px;padding:0 8px 18px;color:#fff;font:700 1.15rem/1.2 "Space Grotesk",sans-serif}
.logo small{display:block;font:400 .78rem "Space Grotesk",sans-serif;color:#8fb0a4}
.led{display:grid;grid-template-columns:repeat(2,14px);gap:4px}
.led i{width:14px;height:14px;border-radius:4px;background:#ffffff1f}
.led i.on{background:#2fd1ae;box-shadow:0 0 10px #2fd1ae}
#nav{flex:1}
.wk{display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:8px 10px;border-radius:10px;cursor:pointer}
.wk b{font:700 .8rem var(--m);color:#7fa89b;min-width:2ch}
.wk:hover{background:#ffffff12}
.wk.on{background:#ffffff1c;color:#fff}
.wk.em{opacity:.4}
.sl{margin:2px 0 10px 34px;display:grid;gap:2px}
.sl a{padding:5px 10px;border-left:2px solid #ffffff26;color:#a9c2b9;text-decoration:none;font-size:.9rem}
.sl a:hover{color:#fff}
.sl a.on{color:#fff;border-color:#2fd1ae;background:#ffffff10}
.th{margin:14px 8px 0;font:inherit;font-size:.82rem;color:#cfe0d9;background:none;border:1px solid #ffffff2e;border-radius:8px;padding:6px 10px;cursor:pointer;align-self:flex-start}
.mn{padding:36px clamp(18px,4vw,60px) 80px;background:radial-gradient(circle,var(--ln) 1px,transparent 1.3px) 0 0/22px 22px,var(--bg)}
#pg{max-width:1040px;margin:0 auto}
.crumb{margin:0;color:var(--mu);font-size:.88rem}
h1{font:700 2.1rem/1.15 "Space Grotesk",sans-serif;letter-spacing:-.02em;margin:.15em 0 .2em}
.lead{color:var(--mu);margin:0 0 18px;max-width:72ch}
p{margin:.5em 0}
code,pre{font-family:var(--m)}
.mu{color:var(--mu);font-size:.88rem}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:16px;margin:14px 0}
.g2,.g3{display:grid;gap:16px;align-items:start}
.g2{grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}
.g2>.card,.g3>.card{margin:0}
.rc{border-left:6px solid var(--c)}
.rh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.n{display:inline-grid;place-items:center;width:24px;height:24px;margin-right:8px;border-radius:50%;background:var(--c);color:var(--on);font-size:.8rem}
.big{font:700 1.6rem var(--m);color:var(--c);word-break:break-all}
sub{font-size:.55em}
.eq,.dv{font:.95rem/1.8 var(--m)}
.eq b,.dv b{color:var(--c,var(--bin))}
.tab{overflow-x:auto;margin:.4em 0}
.tg{padding:3px 11px;border:1px solid var(--ln);border-radius:999px;font-size:.88rem}
.sw{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin:12px 0;max-width:600px}
.sw2{grid-template-columns:repeat(2,92px)}
.bit{aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 1.5rem var(--m);color:var(--ink);background:var(--bg);border:2px solid var(--ln);border-radius:10px;padding:0;cursor:pointer;transition:background .15s,color .15s,box-shadow .15s,transform .1s}
.bit small{font:.64rem var(--m);opacity:.7}
.bit:active{transform:scale(.93)}
.bit[aria-pressed=true]{background:var(--bin);border-color:var(--bin);color:var(--on);box-shadow:0 0 18px color-mix(in srgb,var(--bin) 55%,transparent)}
.pad{border-style:dashed;opacity:.45;cursor:default}
.lb{grid-column:1/-1;font-size:.84rem;font-weight:600;color:var(--c);margin-top:6px}
.br{text-align:center;font:700 1.5rem var(--m);color:var(--c);border-bottom:4px solid var(--c);border-radius:0 0 10px 10px;padding-bottom:2px}
.gs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.g{display:flex;flex-direction:column;align-items:center;border:2px solid var(--c);border-radius:10px;padding:3px 9px;font-family:var(--m)}
.g i{font-style:normal;letter-spacing:.1em}
.g b{color:var(--c);font-size:1.2rem}
.row{display:flex;gap:8px;margin-top:10px}
.btn{display:inline-block;text-decoration:none;font:inherit;font-weight:600;cursor:pointer;color:var(--on);background:var(--ink);border:0;border-radius:10px;padding:9px 16px}
.pl{font:inherit;font-size:.86rem;padding:5px 12px;border-radius:999px;border:1px solid var(--ln);background:var(--pn);color:var(--ink);cursor:pointer}
.pl:hover{border-color:var(--bin)}
.seg{display:flex;gap:6px}
.seg button{flex:1;font:inherit;font-weight:600;font-size:.88rem;cursor:pointer;color:var(--c,var(--bin));background:none;border:2px solid var(--c,var(--bin));border-radius:10px;padding:7px 12px}
.seg .on{background:var(--c,var(--bin));color:var(--on)}
.cv .seg{margin-bottom:10px}
input{font:700 1.4rem var(--m);color:var(--ink);background:var(--bg);border:2px solid var(--ln);border-radius:12px;padding:8px 12px}
#iv,#qa{width:100%}
input[type=number]{width:130px;font-size:1.2rem}
input[type=range]{width:min(260px,100%);padding:0;border:0;background:none;accent-color:var(--bin)}
label{display:flex;align-items:center;gap:8px}
.er{color:var(--no);min-height:1.3em;margin:.4em 0 0;font-size:.9rem}
.ok{color:var(--ok);font-weight:700}
.no{color:var(--no);font-weight:700}
.q{font-size:1.2rem}
:focus-visible{outline:3px solid var(--dec);outline-offset:2px}
.hub{display:block;width:100%;max-width:380px;margin:8px auto 0}
.hub line{stroke:var(--mu);stroke-width:2;marker-start:url(#a);marker-end:url(#a)}
.wv{display:block;width:100%;height:auto;margin-top:8px;background:var(--bg);border-radius:10px}
table{border-collapse:collapse;font:.9rem var(--m);margin-top:8px}
th,td{padding:4px 12px;text-align:center;border-bottom:1px solid var(--ln)}
.tt{font-weight:600}
.tt .hit{background:color-mix(in srgb,var(--bin) 22%,transparent);font-weight:700}
.tt.big{width:100%;font-size:1rem}
summary{cursor:pointer;font-weight:600}
.lamp{width:18px;height:18px;border-radius:50%;background:var(--ln);transition:.15s}
.lamp.on{background:#f7c948;box-shadow:0 0 14px #f7c948}
.qb{width:44px;font:700 1rem var(--m);color:var(--ink);background:var(--bg);border:2px solid var(--ln);border-radius:8px;cursor:pointer}
.bt{display:flex;gap:4px;margin-top:10px}
.c{width:38px;height:46px;display:grid;place-items:center;font:700 1.15rem var(--m);border:2px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);padding:0}
.c:nth-child(4){margin-right:10px}
.c.on{background:var(--c);border-color:var(--c);color:var(--on)}
.c.s{border-color:var(--oct)}
button.c{cursor:pointer}
.km{display:grid;gap:6px;max-width:470px}
.kh{display:grid;place-items:center;font:700 .85rem var(--m);color:var(--mu)}
.kc{position:relative;aspect-ratio:1;font:700 1.6rem var(--m);color:var(--ink);background:var(--bg);border:2px solid var(--ln);border-radius:10px;cursor:pointer;padding:0}
.kc small{position:absolute;top:4px;left:6px;font:.62rem var(--m);opacity:.6}
.kc.v1{background:color-mix(in srgb,var(--bin) 20%,var(--pn));border-color:var(--bin)}
.kc.v2{background:repeating-linear-gradient(45deg,var(--pn) 0 6px,var(--ln) 6px 12px)}
.dots{position:absolute;bottom:5px;left:0;right:0;display:flex;justify-content:center;gap:3px}
.dots i{width:9px;height:9px;border-radius:50%}
.sq{display:inline-block;width:11px;height:11px;border-radius:3px}
.k2{font:700 1.6rem var(--m)}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:36px}
.ck{display:block;width:100%;max-width:640px;height:auto;margin:8px 0;background:var(--bg);border-radius:10px}.w{fill:none;stroke:var(--ln);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.w.h{stroke:var(--bin)}.dt{fill:var(--ln)}.dt.h{fill:var(--bin)}.gb{fill:var(--pn);stroke:var(--ink);stroke-width:2}.gb.on{fill:color-mix(in srgb,var(--bin) 24%,var(--pn))}.gb.nf{fill:none}.gl{font:700 12px var(--m);fill:var(--ink)}h2{font-size:1.25rem;margin:1.2em 0 .4em}
@media(max-width:860px){body{display:block}.sb{position:static;height:auto}.c{width:30px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<aside class="sb">
<div class="logo"><span class="led"><i class="on"></i><i></i><i></i><i class="on"></i></span><span>Sistem Digital<small>Media ajar interaktif</small></span></div>
<nav id="nav" aria-label="Daftar minggu"></nav>
<button class="th" id="th">Ganti tema</button>
</aside>
<main class="mn"><div id="pg"></div></main>
<script>
const $=s=>document.querySelector(s),M={};
try{const t=localStorage.t;if(t)document.documentElement.dataset.theme=t}catch(e){}
const COL={2:'bin',8:'oct',10:'dec',16:'hex'},NM={2:'Biner',8:'Oktal',10:'Desimal',16:'Heksa'};
const pad=(b,k)=>b.padStart(Math.ceil(b.length/k)*k,'0');
const grp=(b,k)=>pad(b,k).match(new RegExp('.{'+k+'}','g'));
const dg=(b,k)=>grp(b,k).map(x=>parseInt(x,2).toString(16).toUpperCase());
const tr=s=>s.replace(/^0+(?=.)/,'');
const bn=(c,k)=>parseInt(c,16).toString(2).padStart(k,'0');
const rc=(n,t,c,body,big,k)=>`<div class="card rc" style="--c:var(--${c})"><div class="rh"><b>${n?`<span class="n">${n}</span>`:''}${t}</b>${big!=null?`<span class="big">${big}<sub>${k}</sub></span>`:''}</div>${body}</div>`;
const chips=(b,k)=>{const d=dg(b,k),c=k==4?'hex':'oct';return '<div class="gs">'+grp(b,k).map((x,i)=>`<span class="g" style="--c:var(--${c})"><i>${x}</i><b>${d[i]}</b></span>`).join('')+'</div>'};
const sum=b=>{const w=[...b].map((c,i)=>c=='1'?2**(b.length-1-i):0).filter(Boolean);return (w.length?w.join(' + '):'0')+' = <b>'+parseInt(b,2)+'</b>'};
const sg=(a,c)=>`<div class="seg">${a.map(([v,l,k])=>`<button data-k="${v}" class="${v==c?'on':''}" style="--c:var(--${k||'bin'})">${l}</button>`).join('')}</div>`;
const act=(el,k)=>el.querySelectorAll('[data-k]').forEach(x=>x.classList.toggle('on',x.dataset.k==k));
const cl=x=>Math.max(-128,Math.min(127,Math.round(+x)||0));

/* ===== MINGGU 1 ===== */
const pengantar=el=>{
const apl=[['Komunikasi','Ponsel, email, pesan instan, WiFi, dan Bluetooth untuk terhubung seluruh dunia.'],['Hiburan','TV digital, streaming, dan game online dengan kualitas tinggi dan interaktif.'],['Industri','Otomasi manufaktur dan layanan kesehatan untuk efisiensi dan akurasi lebih baik.'],['Otomasi rumah','Lampu pintar, termostat, kamera, dan kunci digital yang bisa diatur dari jarak jauh.'],['IoT','Kulkas dan mesin cuci yang terhubung internet, belajar kebiasaan pengguna.'],['Kecerdasan buatan','Pengolahan data besar (big data), algoritma belajar, otomasi industri 4.0.']];
el.innerHTML=`<div class="g2">
${rc(0,'Apa itu Sistem Digital?','bin','<p><b>Sistem digital</b> adalah sistem yang bekerja dengan data dalam bentuk biner: angka 0 dan 1.</p><p>Digunakan untuk mengolah, menyimpan, dan mengirim informasi dengan akurasi dan kecepatan tinggi.</p>')}
${rc(0,'Analog vs Digital','dec','<p><b>Analog:</b> Memakai sinyal kontinu (gelombang). Contoh: radio AM/FM, kaset audio, rekam video VHS. Rentan gangguan luar (noise).</p><p><b>Digital:</b> Memakai sinyal diskrit (angka 0 dan 1). Contoh: CD, DVD, streaming, smartphone. Tahan gangguan, kualitas stabil.</p>')}
${rc(0,'Kenapa Digital?','hex','<p>✓ <b>Akurasi tinggi:</b> Data tidak berubah saat ditransmisi (0 tetap 0, 1 tetap 1).</p><p>✓ <b>Tahan gangguan:</b> Noise kecil tidak mempengaruhi pembacaan 0/1.</p><p>✓ <b>Mudah diproses:</b> Komputer hanya "mengerti" 0 dan 1.</p><p>✓ <b>Hemat ruang:</b> Data besar bisa dimampatkan dan disimpan dalam volume kecil.</p>')}
${rc(0,'Karakteristik data digital','oct','<p><b>Diskrit (terputus):</b> Data bukan kurva mulus, tapi nilai-nilai terpisah. Misal, suara analog yang mulus diubah jadi sampel-sampel angka.</p><p><b>Biner (basis 2):</b> Hanya 0 dan 1. Mudah diimplementasikan dengan transistor (on/off) di chip elektronik.</p>')}
</div>
<div class="card"><b>Proses konversi analog → digital</b><p class="mu">Sinyal analog (gelombang terus-menerus) → <b>sampling</b> (ambil sampel) → <b>kuantisasi</b> (bulatkan ke level diskrit) → sinyal digital (nilai 0/1).</p><p>Geser slider untuk ubah resolusi (jumlah bit). Semakin banyak bit, semakin halus hasil digital mendekati analog asli.</p>
<label style="margin-top:12px"><input type="range" id="rs" min="1" max="5" value="2" aria-label="Resolusi bit"><b id="rl"></b></label>
<svg id="wv" class="wv" viewBox="0 0 600 180" role="img" aria-label="Gelombang analog dan hasil digitalnya"></svg>
<p class="mu"><span style="color:var(--dec)">Garis putus: sinyal analog</span> | <span style="color:var(--bin)">Garis tebal: sinyal digital</span></p>
</div>
<h2>Aplikasi dalam kehidupan sehari-hari</h2><div class="g3">${apl.map(a=>`<div class="card"><b>${a[0]}</b><p class="mu">${a[1]}</p></div>`).join('')}</div>`;
const f=i=>Math.sin(i/48*Math.PI*4),Y=v=>90-v*70,X=i=>i*12.5;
const dr=()=>{const b=+$('#rs').value,L=2**b;let A='',D='';
for(let i=0;i<=48;i++)A+=`${X(i)},${Y(f(i))} `;
for(let i=0;i<48;i++){const q=Math.round((f(i)+1)/2*(L-1))/(L-1)*2-1;D+=`${X(i)},${Y(q)} ${X(i+1)},${Y(q)} `}
$('#wv').innerHTML=`<polyline points="${D}" fill="none" stroke="var(--bin)" stroke-width="3"/><polyline points="${A}" fill="none" stroke="var(--dec)" stroke-width="2" stroke-dasharray="5 4"/>`;
$('#rl').textContent=`${b} bit = ${L} level (resolusi)`};
$('#rs').oninput=dr;dr()};

const konsepBiner=el=>{
el.innerHTML=`<div class="g2">
${rc(0,'Basis 2 (Binary)','bin','<p><b>Digit:</b> Hanya ada 0 dan 1 (dua simbol saja).</p><p><b>Bobot posisi:</b> Setiap posisi bernilai 2<sup>n</sup>.</p><p class="eq">Contoh: <code>1101<sub>2</sub></code> = 1×2³ + 1×2² + 0×2¹ + 1×2⁰ = 8 + 4 + 0 + 1 = 13</p>')}
${rc(0,'Bit dan Byte','hex','<p><b>Bit:</b> Digit biner tunggal (0 atau 1). Satuan terkecil data digital.</p><p><b>Nibble:</b> 4 bit (half-byte).</p><p><b>Byte:</b> 8 bit (satuan standar penyimpanan).</p><p><b>Word:</b> 16 bit (atau lebih, tergantung arsitektur CPU).</p>')}
${rc(0,'MSB dan LSB','oct','<p><b>MSB (Most Significant Bit):</b> Bit paling kiri, bobot terbesar (posisi tertinggi).</p><p><b>LSB (Least Significant Bit):</b> Bit paling kanan, bobot terkecil (posisi terendah).</p><p class="eq">Contoh: <code><b>1</b>1010010</code> ← MSB | LSB ← <code>1101001<b>0</b></code></p>')}
${rc(0,'Nilai posisi 2ⁿ','dec','<p><b>Ingat bobot tiap posisi:</b></p><p style="text-align:center;font:700 .9rem var(--m);letter-spacing:.1em;margin-top:8px">2⁷ 2⁶ 2⁵ 2⁴ 2³ 2² 2¹ 2⁰<br>128 64 32 16 8 4 2 1</p><p class="mu">Jika bit bernilai 1, tambahkan bobotnya. Jika 0, lewati.</p>')}
</div>`;
};

const metodeKonversi=el=>{
el.innerHTML=`<div class="card"><p><b style="font-size:1.1em">Strategi: ubah dulu ke BINER, lalu ke basis lain</b></p><p class="mu">Biner adalah "jembatan" untuk semua konversi. Kenapa? Karena:</p><p>✓ Desimal, oktal, heksa adalah cara lain tulis angka. Biner adalah cara komputer "menyimpan" angka (urutan transistor on/off).</p><p>✓ Kelompok bit memudahkan konversi: 4 bit sekaligus untuk heksa (16 nilai), 3 bit untuk oktal (8 nilai).</p></div>
<svg class="hub" viewBox="0 0 320 230" role="img" aria-label="Biner di tengah, terhubung dengan desimal, oktal, dan heksa">
<defs><marker id="a" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" style="fill:var(--mu)"/></marker></defs>
<line x1="160" y1="52" x2="160" y2="78"/><line x1="125" y1="146" x2="88" y2="178"/><line x1="195" y1="146" x2="232" y2="178"/>
<rect x="110" y="6" width="100" height="40" rx="10" style="fill:var(--dec)"/><rect x="100" y="84" width="120" height="56" rx="12" style="fill:var(--bin)"/>
<rect x="10" y="184" width="120" height="40" rx="10" style="fill:var(--oct)"/><rect x="190" y="184" width="120" height="40" rx="10" style="fill:var(--hex)"/>
<g text-anchor="middle" font-weight="700" font-size="14" style="fill:var(--on)"><text x="160" y="31">Desimal</text><text x="160" y="108" font-size="18">Biner</text><text x="160" y="127" font-size="11" font-weight="400">basis 2</text><text x="70" y="209">Oktal</text><text x="250" y="209">Heksa</text></g>
<g font-size="11" style="fill:var(--mu)"><text x="170" y="62">÷ 2</text><text x="170" y="77">bobot</text><text x="4" y="156">3 bit</text><text x="316" y="156" text-anchor="end">4 bit</text></g></svg>

<div class="g2">
${rc(1,'Desimal → Biner','dec','<p><b>Metode: Bagi 2 berulang</b></p><p>Bagi desimal dengan 2, catat sisa (0 atau 1). Terus bagi hasilnya hingga 0. Baca sisa dari bawah ke atas.</p><p class="eq">Contoh 13 ÷ 2:</p><p class="eq" style="font-size:.9rem">13÷2 = 6 sisa <b>1</b><br>6÷2 = 3 sisa <b>0</b><br>3÷2 = 1 sisa <b>1</b><br>1÷2 = 0 sisa <b>1</b><br>Baca dari bawah: <b>1101</b></p>')}
${rc(2,'Biner → Desimal','dec','<p><b>Metode: Jumlahkan bobot</b></p><p>Tiap posisi bit bernilai 2<sup>n</sup>. Jika bit = 1, tambahkan bobotnya. Jika 0, lewati.</p><p class="eq">Contoh 1101₂:<br>1×2³ + 1×2² + 0×2¹ + 1×2⁰<br>= 8 + 4 + 0 + 1 = <b>13</b></p>')}
${rc(3,'Biner → Heksa','hex','<p><b>Metode: Kelompok 4 bit</b></p><p>Kelompokkan bit dari kanan, setiap 4 bit jadi 1 digit heksa. Kurang dari 4? Tambah 0 di kiri.</p><p class="eq">Contoh 11010110₂:<br>1101 | 0110<br>13 (D) | 6 (6)<br>= <b>0xD6</b></p>')}

const mini=(n,on,dc)=>{
const N=1<<n,all=[...on,...dc];let P=[];
for(let m=0;m<N;m++)for(let v=0;v<N;v++){if(v&m)continue;
const cells=[];for(let i=0;i<N;i++)if((i&~m)==v)cells.push(i);
if(cells.every(c=>all.includes(c))&&cells.some(c=>on.includes(c)))P.push({m,v,cells})}
P=P.filter(p=>!P.some(q=>q!==p&&q.cells.length>p.cells.length&&p.cells.every(c=>q.cells.includes(c))));
let left=on.slice(),sel=[];
while(left.length){let k=null;
for(const c of left){const d=P.filter(p=>p.cells.includes(c));if(d.length==1){k=d[0];break}}
if(!k){const cv=p=>p.cells.filter(c=>left.includes(c)).length;k=P.filter(p=>!sel.includes(p)).sort((a,b)=>cv(b)-cv(a))[0]}
sel.push(k);left=left.filter(c=>!k.cells.includes(c))}
return sel};
const kmap=el=>{

el.innerHTML=`<div class="card"><div class="rh">${sg([[2,'2 variabel'],[3,'3 variabel'],[4,'4 variabel']],4)}<button class="pl" data-z="c">Kosongkan</button></div><div class="gs" style="margin-top:10px">${PZ.map((p,i)=>`<button class="pl" data-z="${i}">${p[0]}</button>`).join('')}</div></div><div class="g2"><div class="card"><div id="km"></div><p class="mu">Ketuk sel: 0 → 1 → X (don't care). Titik warna menandai kelompok.</p></div><div class="card" id="kr"></div></div>`;
const up=()=>{
act(el,n);const N=1<<n,r=n>>1,c=n-r,R=1<<r,C=1<<c,on=[],dc=[];
for(let m=0;m<N;m++){st[m]==1&&on.push(m);st[m]==2&&dc.push(m)}
const sel=mini(n,on,dc),hd=(k,b)=>g(k).toString(2).padStart(b,'0');
let h=`<div class="km" style="grid-template-columns:auto repeat(${C},1fr)"><div class="kh">${V.slice(0,r)}\\${V.slice(r,n)}</div>`;
for(let j=0;j<C;j++)h+=`<div class="kh">${hd(j,c)}</div>`;
for(let i=0;i<R;i++){h+=`<div class="kh">${hd(i,r)}</div>`;for(let j=0;j<C;j++){const m=(g(i)<<c)|g(j);
h+=`<button class="kc v${st[m]}" data-m="${m}" aria-label="m${m} bernilai ${'01X'[st[m]]}"><small>m${m}</small>${'01X'[st[m]]}<span class="dots">${sel.map((p,k)=>p.cells.includes(m)?`<i style="background:${col(k)}"></i>`:'').join('')}</span></button>`}}
$('#km').innerHTML=h+'</div>';
const term=p=>{let s='';for(let j=0;j<n;j++){const b=1<<(n-1-j);if(!(p.m&b))s+=V[j]+(p.v&b?'':"'")}return s||'1'};
$('#kr').innerHTML=`<b>Hasil minimum (SOP)</b><p class="k2">${sel.length?sel.map((p,k)=>`<span style="color:${col(k)}">${term(p)}</span>`).join(' + '):'0'}</p>`+sel.map((p,k)=>`<p><i class="sq" style="background:${col(k)}"></i> <b>${term(p)}</b>: kelompok ${p.cells.length} sel (m${p.cells.join(', m')})</p>`).join('')+`<p class="mu">Σm(${on.join(', ')||'-'})${dc.length?' + d('+dc.join(', ')+')':''}. Variabel yang berubah dalam kelompok dihilangkan.</p>`};
el.onclick=e=>{const k=e.target.closest('[data-k]'),m=e.target.closest('[data-m]'),z=e.target.closest('[data-z]');

/* ===== PUSTAKA SIMBOL GERBANG & MESIN RANGKAIAN (ANSI/IEEE) ===== */
const OR_P='M0 0Q28 0 50 20Q28 40 0 40Q12 20 0 0Z';
const GP={AND:['M0 0H25A20 20 0 0 1 25 40H0Z',45,0],OR:[OR_P,50,3],XOR:[OR_P,50,-2],NOT:['M0 2L36 20L0 38Z',36,0]};
const GF={AND:(a,b)=>a&b,OR:(a,b)=>a|b,XOR:(a,b)=>a^b,NOT:a=>1-a,NAND:(a,b)=>1-(a&b),NOR:(a,b)=>1-(a|b),XNOR:(a,b)=>1-(a^b)};
const BB=['NAND','NOR','XNOR','NOT'],bs=t=>({NAND:'AND',NOR:'OR',XNOR:'XOR'})[t]||t;
const ev=(S,v)=>{const n={...v};S.g.forEach(g=>n[g[4]]=GF[g[0]](...g[3].map(k=>n[k])));return n};
const ckt=(S,v)=>{
const n=v?ev(S,v):{},src={},D={},gw=t=>GP[bs(t)][1]+(BB.includes(t)?8:0);
const py=g=>g[3].length==1?[g[2]+20]:[g[2]+10,g[2]+30],px=g=>g[1]+GP[bs(g[0])][2];
S.i.forEach(i=>src[i[0]]=[52,i[1],i[2]]);
S.g.forEach(g=>src[g[4]]=[g[1]+gw(g[0]),g[2]+20,g[5]]);
S.g.forEach(g=>g[3].forEach((k,j)=>(D[k]=D[k]||[]).push([px(g),py(g)[j]])));
const h=k=>v&&n[k]?' h':'';let w='',d='';
for(const k in D){const[sx,sy,b0]=src[k],bx=b0||Math.min(...D[k].map(p=>p[0]))-14;
D[k].forEach(([dx,dy])=>{w+=`<path class="w${h(k)}" d="M${sx} ${sy}H${bx}V${dy}H${dx}"/>`;if(D[k].length>1)d+=`<circle cx="${bx}" cy="${dy}" r="3" class="dt${h(k)}"/>`})}
const G=S.g.map(g=>{const t=g[0],b=bs(t),W=GP[b][1];return `<g transform="translate(${g[1]} ${g[2]})"><path class="gb${v&&n[g[4]]?' on':''}" d="${GP[b][0]}"/>${b=='XOR'?'<path class="gb nf" d="M-7 0Q5 20-7 40"/>':''}${BB.includes(t)?`<circle class="gb" cx="${W+4}" cy="20" r="4"/>`:''}</g>`}).join('');
const L=S.i.map(i=>`<text class="gl" x="46" y="${i[1]+4}" text-anchor="end">${i[0]}${v?'='+v[i[0]]:''}</text>`).join('');
const O=S.o.map(([l,k])=>{const[sx,sy]=src[k];return `<path class="w${h(k)}" d="M${sx} ${sy}H${sx+24}"/><circle cx="${sx+32}" cy="${sy}" r="7" style="fill:${v&&n[k]?'#f7c948':'var(--ln)'};stroke:var(--mu)"/><text class="gl" x="${sx+45}" y="${sy+4}">${l}${v?'='+n[k]:''}</text>`}).join('');
return `<svg class="ck" viewBox="0 0 ${S.w} ${S.h}" role="img" aria-label="Rangkaian gerbang logika">${w}${d}${G}${L}${O}</svg>`};
const one=t=>({w:250,h:70,i:t=='NOT'?[['A',35]]:[['A',25],['B',45]],g:[[t,110,15,t=='NOT'?['A']:['A','B'],'Y']],o:[['Y','Y']]});
const TT=(S,N,outs,v)=>`<div class="tab"><table class="tt"><tr>${N.concat(outs).map(x=>`<th>${x}</th>`).join('')}</tr>${Array.from({length:1<<N.length},(_,i)=>{const r=N.map((_,j)=>i>>(N.length-1-j)&1),o=ev(S,Object.fromEntries(N.map((n,j)=>[n,r[j]])));return `<tr class="${v&&N.every((n,j)=>v[n]==r[j])?'hit':''}">${r.map(x=>`<td>${x}</td>`).join('')}${outs.map(k=>`<td><b>${o[k]}</b></td>`).join('')}</tr>`}).join('')}</table></div>`;

el.innerHTML=`<div class="card"><b>Cara membaca simbol gerbang (standar ANSI/IEEE)</b><div class="g3" style="margin-top:10px"><div><b>Bentuk badan</b><p class="mu">Datar di input, bulat di output = <b>AND</b>. Melengkung di kedua sisi = <b>OR</b>. Segitiga = <b>NOT/buffer</b>.</p></div><div><b>Bubble (○)</b><p class="mu">Lingkaran kecil di output berarti hasilnya <b>dibalik</b>: AND→NAND, OR→NOR, XOR→XNOR.</p></div><div><b>Garis ganda</b><p class="mu">Lengkungan tambahan di sisi input menandai <b>eksklusif</b> (XOR dan XNOR).</p></div></div></div>
<div class="g3" style="margin-bottom:16px">${[['AND','NAND'],['OR','NOR'],['XOR','XNOR']].map(p=>`<div class="card"><b>${p[0]} → ${p[1]}</b>${ckt(one(p[0]))}${ckt(one(p[1]))}</div>`).join('')}</div>
<h2>Tujuh gerbang dasar</h2><div class="g2">${GD.map(g=>{const S=one(g[0]),N=g[0]=='NOT'?['A']:['A','B'];return rc(0,g[0]+' &nbsp;<code>'+g[1]+'</code>',g[2],`${ckt(S)}<p>${g[3]}</p>${TT(S,N,['Y'])}<p><b>Analogi saklar:</b> ${g[4]}</p><p><b>Contoh nyata:</b> ${g[6]}</p><p class="mu"><b>IC:</b> ${g[5]}<br><b>Tips:</b> ${g[7]}</p>`)}).join('')}</div>
<div class="g2"><div class="card"><b>Prioritas operasi</b><p><code>NOT &gt; AND &gt; OR</code></p><p class="mu">Contoh: <code>A + B · C′</code> dihitung <code>A + (B · (C′))</code>. Gunakan tanda kurung bila ragu.</p></div><div class="card"><b>Kenapa banyak input?</b><p class="mu">AND/OR/NAND/NOR dapat punya 3, 4, atau lebih input dengan aturan sama: AND 1 jika <b>semua</b> input 1; OR 0 jika <b>semua</b> input 0. XOR n-input bernilai 1 bila jumlah input 1 ganjil.</p></div></div>`};

const gates2=el=>{let v={A:1,B:0};
el.innerHTML=`<div class="card"><b>Buka/tutup saklar dengan ketukan</b><p class="mu">Kabel <b style="color:var(--bin)">berwarna hijau</b> membawa sinyal 1, kabel abu-abu membawa 0. Badan gerbang menyala saat outputnya 1, lampu kuning di ujung menunjukkan hasil. Baris tabel yang sesuai input saat ini akan bersinar.</p><div class="sw sw2"><button class="bit" data-s="A"><span></span><small>A</small></button><button class="bit" data-s="B"><span></span><small>B</small></button></div></div><div class="g2" id="gg"></div>`;
const up=()=>{el.querySelectorAll('[data-s]').forEach(x=>{x.setAttribute('aria-pressed',!!v[x.dataset.s]);x.firstChild.textContent=v[x.dataset.s]});
$('#gg').innerHTML=GD.map(g=>{const S=one(g[0]),N=g[0]=='NOT'?['A']:['A','B'],y=ev(S,v).Y;return rc(0,g[0]+' &nbsp;<code>'+g[1]+'</code>',g[2],`${ckt(S,v)}<p class="eq">${N.map(k=>k+'='+v[k]).join(', ')} → Y = <b>${y}</b></p>${TT(S,N,['Y'],v)}`)}).join('')};
el.onclick=e=>{const x=e.target.closest('[data-s]');if(x){v[x.dataset.s]^=1;up()}};up()};

const EX=[
['Y = A·B + C′','AND(A,B) dan NOT(C) masuk ke OR. Y menyala jika A dan B sama-sama 1, atau C = 0.',{w:380,h:150,i:[['A',20],['B',40],['C',120]],g:[['AND',130,10,['A','B'],'n1'],['NOT',130,100,['C'],'n2'],['OR',270,55,['n1','n2'],'Y']],o:[['Y','Y']]}],
['Y = (A+B)·C′','Urutan terbalik: OR(A,B) dulu, lalu di-AND dengan C′. Perhatikan kurung mengubah susunan gerbang.',{w:380,h:150,i:[['A',20],['B',40],['C',120]],g:[['OR',130,10,['A','B'],'n1'],['NOT',130,100,['C'],'n2'],['AND',270,55,['n1','n2'],'Y']],o:[['Y','Y']]}],
['Y = A′B + AB′ (XOR)','XOR dibangun dari 2 NOT, 2 AND, dan 1 OR. Cocokkan tabelnya dengan gerbang XOR: sama persis.',{w:450,h:180,i:[['A',20,95],['B',150,80]],g:[['NOT',120,0,['A'],'na'],['NOT',120,130,['B'],'nb'],['AND',250,15,['na','B'],'n1',215],['AND',250,105,['A','nb'],'n2',215],['OR',370,60,['n1','n2'],'Y']],o:[['Y','Y']]}]];
const exprCkt=el=>{let k=0;
el.innerHTML=`<div class="card"><b>Dari ekspresi Boolean ke rangkaian</b><p class="mu">Cara membaca: kerjakan dari operasi <b>paling dalam / prioritas tertinggi</b> (NOT, lalu AND, lalu OR). Tiap operasi menjadi satu gerbang, outputnya masuk ke gerbang berikutnya.</p>${sg(EX.map((x,i)=>[i,x[0]]),0)}<div id="xc" style="margin-top:12px"></div></div>`;
const up=()=>{act(el,k);const[t,ket,S]=EX[k],N=S.i.map(i=>i[0]);mount($('#xc'),N,S,(v)=>`<p>${ket}</p><p class="mu">Tabel kebenaran lengkap (baris aktif bersinar):</p>${TT(S,N,['Y'],v)}`)};
el.addEventListener('click',e=>{const x=e.target.closest('[data-k]');if(x&&el.contains(x)){k=+x.dataset.k;up()}});up()};

/* ===== MINGGU 5: adder level gerbang ===== */
const AS=[{w:290,h:130,i:[['A',20,100],['B',40,110]],g:[['XOR',130,10,['A','B'],'S'],['AND',130,70,['A','B'],'C']],o:[['S','S'],['C','C']]},
{w:580,h:235,i:[['A',20,90],['B',40,100],['Cin',215,245]],g:[['XOR',130,10,['A','B'],'p',215],['AND',130,70,['A','B'],'g'],['XOR',280,10,['p','Cin'],'S'],['AND',280,150,['p','Cin'],'q'],['OR',410,100,['g','q'],'Cout',380]],o:[['S','S'],['Cout','Cout']]}];
const adderCkt=el=>{let k=0;
el.innerHTML=`<div class="card"><b>Adder di level gerbang</b><p class="mu">Ubah input dan amati sinyal merambat melalui tiap gerbang.</p>${sg([[0,'Half Adder'],[1,'Full Adder','dec']],0)}<div id="ac" style="margin-top:12px"></div></div>`;
const up=()=>{act(el,k);const S=AS[k],N=S.i.map(i=>i[0]),O=k?['S','Cout']:['S','C'];
mount($('#ac'),N,S,(v,n)=>{const t=N.reduce((s,x)=>s+v[x],0);return `<p class="eq">${N.map(x=>v[x]).join(' + ')} = ${t} desimal = <b>${n[O[1]]}${n.S}</b>₂ → Cout/C = <b>${n[O[1]]}</b>, S = <b>${n.S}</b></p>`+(k?`<p class="mu"><b>Cara kerja:</b> XOR pertama menghasilkan <b>P</b> = A⊕B (bit berbeda, calon penjumlah). XOR kedua menambahkan Cin → <b>S</b>. AND pertama (A·B) = <b>Generate</b>: carry pasti terjadi. AND kedua (P·Cin) = carry yang <b>dirambatkan</b> dari Cin. OR menggabungkan keduanya → Cout. Nilai P saat ini: <b>${n.p}</b>, G: <b>${n.g}</b>.</p>`:`<p class="mu"><b>Cara kerja:</b> XOR memberi bit jumlah (1 bila A dan B berbeda). AND memberi carry (hanya 1+1 yang menghasilkan carry). Half adder tidak punya Cin sehingga tidak bisa dirantai; dua half adder + OR = full adder.</p>`)+TT(S,N,O,v)})};
el.addEventListener('click',e=>{const x=e.target.closest('[data-k]');if(x&&el.contains(x)){k=+x.dataset.k;up()}});up()};

/* ===== MINGGU 6: gerbang universal level gerbang ===== */
const UC=t=>[['NOT A',{w:290,h:70,i:[['A',35,75]],g:[[t,110,15,['A','A'],'Y']],o:[['Y','Y']]},v=>1-v.A],
['A AND B',t=='NAND'?{w:360,h:80,i:[['A',25],['B',45]],g:[['NAND',110,15,['A','B'],'n',170],['NAND',230,15,['n','n'],'Y']],o:[['Y','Y']]}:{w:430,h:140,i:[['A',20,90],['B',120,90]],g:[['NOR',110,0,['A','A'],'a'],['NOR',110,100,['B','B'],'b'],['NOR',260,50,['a','b'],'Y']],o:[['Y','Y']]},v=>v.A&v.B],
['A OR B',t=='NAND'?{w:430,h:140,i:[['A',20,90],['B',120,90]],g:[['NAND',110,0,['A','A'],'a'],['NAND',110,100,['B','B'],'b'],['NAND',260,50,['a','b'],'Y']],o:[['Y','Y']]}:{w:360,h:80,i:[['A',25],['B',45]],g:[['NOR',110,15,['A','B'],'n',180],['NOR',240,15,['n','n'],'Y']],o:[['Y','Y']]},v=>v.A|v.B]];
const UX=[['A XOR B (hanya dari 4 NAND)',{w:470,h:170,i:[['A',60,80],['B',80,80]],g:[['NAND',110,50,['A','B'],'n1',185],['NAND',230,0,['A','n1'],'n2',300],['NAND',230,100,['n1','B'],'n3',300],['NAND',350,50,['n2','n3'],'Y']],o:[['Y','Y']]},v=>v.A^v.B]];
const uni2=el=>{let v={A:1,B:0};
el.innerHTML=`<div class="card"><b>Pembuktian: bangun gerbang dari NAND atau NOR saja</b><p class="mu">Setiap rangkaian di bawah <b>hanya memakai satu jenis gerbang</b>. Bandingkan hasilnya dengan gerbang aslinya. Ubah A dan B untuk menguji semua kombinasi.</p><div class="sw sw2"><button class="bit" data-s="A"><span></span><small>A</small></button><button class="bit" data-s="B"><span></span><small>B</small></button></div></div><div class="g2" id="uo"></div>`;
const up=()=>{el.querySelectorAll('[data-s]').forEach(x=>{x.setAttribute('aria-pressed',!!v[x.dataset.s]);x.firstChild.textContent=v[x.dataset.s]});
const card=(t,[n,S,f])=>{const y=ev(S,v).Y,r=f(v),c=t=='XOR'?'bin':t=='NAND'?'bin':'oct';return rc(0,(t=='XOR'?'':t+': ')+n,c,`${ckt(S,v)}<p class="eq">Rangkaian: <b>${y}</b> &nbsp; Gerbang asli: <b>${r}</b> &nbsp; <span class="${y==r?'ok':'no'}">${y==r?'✓ cocok':'✗ beda'}</span></p>`)};
$('#uo').innerHTML=UC('NAND').map(x=>card('NAND',x)).join('')+UC('NOR').map(x=>card('NOR',x)).join('')+UX.map(x=>card('XOR',x)).join('')};
el.onclick=e=>{const x=e.target.closest('[data-s]');if(x){v[x.dataset.s]^=1;up()}};up()};

const MS={w:460,h:150,i:[['D0',20],['S',75,90],['D1',100]],g:[['NOT',130,55,['S'],'nS',175],['AND',210,10,['D0','nS'],'a'],['AND',210,90,['D1','S'],'b'],['OR',330,50,['a','b'],'Y',300]],o:[['Y','Y']]};
const mux2=el=>{mux(el);const d=document.createElement('div');d.className='card';d.innerHTML='<b>MUX 2:1 di level gerbang</b><p class="mu">Y = S′·D0 + S·D1. Saat S = 0 gerbang AND atas terbuka (D0 lewat), saat S = 1 AND bawah terbuka (D1 lewat). Inilah arti &quot;selektor data&quot;: S membuka satu jalur dan menutup yang lain.</p><div></div>';el.appendChild(d);mount(d.lastChild,['D0','D1','S'],MS,(v,n)=>`<p class="eq">S=${v.S} → Y = D${v.S} = <b>${n.Y}</b></p>`)};
const DS={w:400,h:240,i:[['A1',20,65],['A0',205,80]],g:[['NOT',110,0,['A1'],'n1',185],['NOT',110,185,['A0'],'n0',200],['AND',240,0,['n1','n0'],'Y0'],['AND',240,55,['n1','A0'],'Y1'],['AND',240,110,['A1','n0'],'Y2'],['AND',240,165,['A1','A0'],'Y3']],o:[['Y0','Y0'],['Y1','Y1'],['Y2','Y2'],['Y3','Y3']]};
const dec2=el=>{dec(el);const d=document.createElement('div');d.className='card';d.innerHTML='<b>Decoder 2-to-4 di level gerbang</b><p class="mu">Tiap output adalah satu <b>minterm</b> dari input: Y0 = A1′A0′, Y1 = A1′A0, Y2 = A1A0′, Y3 = A1A0. Empat gerbang AND memeriksa kombinasi berbeda, sehingga hanya satu yang bernilai 1.</p><div></div>';el.appendChild(d);mount(d.lastChild,['A1','A0'],DS,(v,n)=>`<p class="eq">A1A0 = ${v.A1}${v.A0} → aktif: <b>Y${v.A1*2+v.A0}</b></p>`)};

{label:'Simulator Gerbang',ket:'Buka/tutup saklar input A dan B: kabel, badan gerbang, dan lampu output menyala sesuai sinyal, lengkap dengan tabel kebenaran.',render:gates2},
{label:'Dari Ekspresi ke Rangkaian',ket:'Ubah ekspresi Boolean menjadi rangkaian gerbang yang bisa diuji langsung, termasuk XOR dari AND-OR-NOT.',render:exprCkt},

/* ===== NAVIGASI ===== */
let W=1,S=0;
const side=()=>{$('#nav').innerHTML=Object.keys(M).map(i=>{const m=M[i],h=m.sub.length;
return `<button class="wk${i==W?' on':''}${h?'':' em'}" data-w="${i}"><b>${i}</b><span>${m.judul||'Segera hadir'}</span></button>`+(i==W&&h?`<div class="sl">${m.sub.map((x,j)=>`<a href="#${i}-${j}" class="${j==S?'on':''}">${x.label}</a>`).join('')}</div>`:'')}).join('')};
const page=()=>{
const m=M[W],pg=$('#pg');
if(!m.sub.length){pg.innerHTML=`<p class="crumb">Minggu ${W}</p><h1>Segera hadir</h1><div class="card"><p>Materi minggu ${W} belum tersedia. Tambahkan di skrip: <code>M[${W}]={judul:'…',sub:[{label:'…',render:fn}]}</code>.</p></div>`;return}
const x=m.sub[S],f=[];
Object.keys(M).forEach(w=>M[w].sub.forEach((s,i)=>f.push([w,i,s.label])));
const k=f.findIndex(y=>y[0]==W&&y[1]==S),p=f[k-1],nx=f[k+1];
pg.innerHTML=`<p class="crumb">Minggu ${W}: ${m.judul}</p><h1>${x.label}</h1>${x.ket?`<p class="lead">${x.ket}</p>`:''}<div id="box"></div><div class="pn">${p?`<a class="btn" href="#${p[0]}-${p[1]}">Sebelumnya: ${p[2]}</a>`:'<span></span>'}${nx?`<a class="btn" href="#${nx[0]}-${nx[1]}">Berikutnya: ${nx[2]}</a>`:''}</div>`;
x.render($('#box'));scrollTo(0,0)};
const show=()=>{const m=(location.hash.match(/#(\d+)-(\d+)/)||[]).slice(1).map(Number);
if(m.length&&M[m[0]]&&M[m[0]].sub[m[1]]){W=m[0];S=m[1]}
side();page()};
$('#nav').onclick=e=>{const b=e.target.closest('[data-w]');if(!b)return;const w=+b.dataset.w;
if(M[w].sub.length)location.hash=w+'-0';else{W=w;S=0;side();page()}};
$('#th').onclick=()=>{const r=document.documentElement,t=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))=='dark'?'light':'dark';r.dataset.theme=t;try{localStorage.t=t}catch(e){}};
addEventListener('hashchange',show);show();
